plugin.multi_upload.name=Multiple Upload Plugin
plugin.multi_upload.desc=Native multiple file upload widget and form extension for XIMA FORMCYCLE.

widget.multi_upload.name=Multiple Upload
widget.multi_upload.default_label=Upload files

property.multi_upload.max_file_size.name=Max. File Size (MB)
property.multi_upload.max_file_size.desc=Maximum file size for each individual file in Megabytes (e.g. 10).
property.multi_upload.max_total_size.name=Max. Total Size (MB)
property.multi_upload.max_total_size.desc=Maximum total size for all uploaded files combined in Megabytes (e.g. 100).
property.multi_upload.max_files.name=Maximum File Count
property.multi_upload.max_files.desc=Maximum number of files allowed to be selected (e.g. 10).
property.multi_upload.allowed_extensions.name=Allowed File Extensions
property.multi_upload.allowed_extensions.desc=Comma-separated list of allowed file extensions (e.g. .pdf, .jpg, .png, .docx, .zip).
property.multi_upload.dropzone_enabled.name=Enable Drag & Drop Zone
property.multi_upload.dropzone_enabled.desc=Renders a modern drag and drop area for files (true or false).
property.multi_upload.theme.name=Color Scheme / Theme
property.multi_upload.theme.desc=Visual theme for the upload element (modern, xima-blue, minimal, dark).
property.multi_upload.button_text.name=Button Text (Select)
property.multi_upload.button_text.desc=Label of the main file selection button.
property.multi_upload.add_more_text.name=Button Text (Add More)
property.multi_upload.add_more_text.desc=Label of the button to add more files.
property.multi_upload.clear_all_text.name=Button Text (Clear All)
property.multi_upload.clear_all_text.desc=Label of the button to remove all files.
property.multi_upload.custom_error_msg.name=Custom Error Message
property.multi_upload.custom_error_msg.desc=Optional custom error message to display upon validation failure.

validation.multi_upload.required=Please select at least one file.
validation.multi_upload.too_many_files=Too many files selected. Maximum {0} files allowed.
validation.multi_upload.file_too_large=File "{0}" exceeds the maximum allowed file size of {1} MB.
validation.multi_upload.total_too_large=The total size of all files exceeds the limit of {0} MB.
validation.multi_upload.extension_not_allowed=The file extension of "{0}" is not allowed. Allowed types: {1}.
validation.multi_upload.duplicate=File "{0}" has already been selected.
validation.multi_upload.empty_file=File "{0}" is empty (0 Bytes).
